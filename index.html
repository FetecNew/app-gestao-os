<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestão de OS FETEC - Assistência Técnica</title>
  
  <!-- ESTILOS FETEC -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300DC41'/><text x='50' y='65' font-size='60' font-weight='bold' fill='%230A0A0A'>⚙</text></svg>">
</head>
<body>
  <div class="container">
    
    <!-- ========== HEADER ========== -->
    <div class="header">
      <div>

      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
          <img src="logo-fetec-v2.svg" alt="FETEC Logo" style="height: 50px; width: auto; filter: drop-shadow(0 0 10px rgba(0, 220, 65, 0.5));">
        </div>

        <h1>Gestão de OS</h1>
        <span>São José dos Campos</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="exportarCSV()" title="Exportar dados em CSV">📊 Exportar</button>
        <button class="btn btn-primary" onclick="abrirNovaOS()" title="Criar nova ordem de serviço">➕ Nova OS</button>
      </div>
    </div>

    <!-- ========== ESTATÍSTICAS ========== -->
    <div class="stats-grid">
      <div class="stat-card blue">
        <div class="label">Total de OS</div>
        <div class="number" id="sTotal">0</div>
      </div>
      <div class="stat-card orange">
        <div class="label">Visita</div>
        <div class="number" id="sVisita">0</div>
      </div>
      <div class="stat-card blue">
        <div class="label">Garantia</div>
        <div class="number" id="sGarantia">0</div>
      </div>
      <div class="stat-card green">
        <div class="label">Aprovada</div>
        <div class="number" id="sAprovada">0</div>
      </div>
      <div class="stat-card purple">
        <div class="label">Desistência</div>
        <div class="number" id="sDesistencia">0</div>
      </div>
      <div class="stat-card teal">
        <div class="label">Faturamento</div>
        <div class="number" id="sFaturamento">R$ 0</div>
      </div>
    </div>

    <!-- ========== TABELA DE OS ========== -->
    <div class="card">
      <div class="card-header">
        <h2>📋 Ordens de Serviço</h2>
        <div class="filters-bar">
          <div class="busca-com-dica">
            <input type="search" id="busca" placeholder="🔎 Buscar cliente, OS, aparelho ou status..." onkeyup="renderizar()" title="Dica: separe por vírgula para buscar vários itens ao mesmo tempo. Ex: visita, garantia">
            <span class="dica-icone" tabindex="0" title="Dica: separe por vírgula para buscar vários itens ao mesmo tempo. Ex: visita, garantia">ℹ️</span>
          </div>
          <label class="filtro-data-label">De <input type="date" id="filtroDataInicio" onchange="renderizar()"></label>
          <label class="filtro-data-label">Até <input type="date" id="filtroDataFim" onchange="renderizar()"></label>
          <button type="button" class="btn btn-outline btn-sm" onclick="limparFiltroData()" title="Limpar filtro de data">✕ Limpar datas</button>
        </div>
      </div>
      <div class="card-body">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>OS</th>
                <th class="th-ordenavel" onclick="alternarOrdenacao('data')" title="Clique para ordenar por data">Data <span id="iconeOrdenacaoData">↕️</span></th>
                <th class="th-ordenavel" onclick="alternarOrdenacao('cliente')" title="Clique para ordenar por cliente">Cliente <span id="iconeOrdenacaoCliente">↕️</span></th>
                <th>Aparelho</th>
                <th>Valor</th>
                <th>Período</th>
                <th>Campanha</th>
                <th class="th-ordenavel" onclick="alternarOrdenacao('status')" title="Clique para ordenar por status">Status <span id="iconeOrdenacaoStatus">↕️</span></th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- ========== MODAL PARA CRIAR/EDITAR ========== -->
  <div class="modal-overlay" id="modalFundo">
    <div class="modal">
      <button class="modal-close" onclick="fecharModal()">✕</button>
      <h2 id="tituloModal">⚙ Nova Ordem de Serviço</h2>
      
      <form onsubmit="event.preventDefault(); salvarOS();">
        <input type="hidden" id="indiceEdicao" value="-1">
        
        <div class="form-grid">
          <!-- Linha 1 -->
          <div class="form-group">
            <label>🔢 Número OS</label>
            <input type="text" id="fNumeroOS" readonly>
          </div>
          <div class="form-group">
            <label>📅 Data *</label>
            <input type="date" id="fData" required>
          </div>
          
          <!-- Linha 2 -->
          <div class="form-group">
            <label>👤 Cliente *</label>
            <input type="text" id="fCliente" required placeholder="Nome do cliente">
          </div>
          <div class="form-group">
            <label>☎️ Telefone</label>
            <input type="tel" id="fTelefone" placeholder="(00) 0000-0000" inputmode="numeric" oninput="this.value = mascararTelefone(this.value)">
          </div>

          <!-- Linha 3 -->
          <div class="form-group">
            <label>🔧 Aparelho *</label>
            <div class="input-wrapper">
              <select id="fAparelho" required></select>
              <button type="button" class="btn-add" onclick="abrirModalNovoItem('aparelho')" title="Adicionar aparelho">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>🏷️ Marca</label>
            <div class="input-wrapper">
              <select id="fMarca"></select>
              <button type="button" class="btn-add" onclick="abrirModalNovoItem('marca')" title="Adicionar marca">+</button>
            </div>
          </div>

          <!-- Linha 4 -->
          <div class="form-group">
            <label>🏠 Endereço</label>
            <input type="text" id="fEndereco" placeholder="Rua, número">
          </div>
          <div class="form-group">
            <label>📝 Complemento</label>
            <input type="text" id="fComplemento" placeholder="Apto, sala, etc">
          </div>

          <!-- Linha 5 -->
          <div class="form-group">
            <label>📮 CEP</label>
            <input type="text" id="fCEP" placeholder="00000-000" inputmode="numeric" oninput="this.value = mascararCEP(this.value)">
          </div>
          <div class="form-group">
            <label>⏰ Período da Visita</label>
            <select id="fPeriodo">
              <option value="">Selecione...</option>
              <option value="Manhã">🌅 Manhã (09:00-12:00)</option>
              <option value="Tarde">🌤️ Tarde (13:00-17:00)</option>
            </select>
          </div>
          
          <!-- Linha 6 -->
          <div class="form-group">
            <label>💵 Valor Serviço (R$)</label>
            <input type="text" id="fVS" inputmode="numeric" placeholder="R$ 0,00" oninput="this.value = mascararMoeda(this.value)">
          </div>
          <div class="form-group">
            <label>🛠️ Valor Peças (R$)</label>
            <input type="text" id="fVP" inputmode="numeric" placeholder="R$ 0,00" oninput="this.value = mascararMoeda(this.value)">
          </div>

          <!-- Linha 7 -->
          <div class="form-group">
            <label>📢 Campanha</label>
            <div class="input-wrapper">
              <select id="fCampanha"></select>
              <button type="button" class="btn-add" onclick="abrirModalNovoItem('campanha')" title="Adicionar campanha">+</button>
            </div>
          </div>
          <div class="form-group">
            <label>🎯 Status</label>
            <select id="fStatus">
              <option value="Visita">🟠 Visita</option>
              <option value="Garantia">🔄 Garantia</option>
              <option value="Aprovada">✅ Aprovada</option>
              <option value="Desistência">❌ Desistência</option>
            </select>
          </div>
          
          <!-- Linha 8 - Full Width -->
          <div class="form-group full-width">
            <label>📌 Observações</label>
            <textarea id="fObs" placeholder="Notas adicionais, recomendações, etc"></textarea>
          </div>
          
          <!-- Ações -->
          <div class="form-actions">
            <button type="button" class="btn btn-danger" onclick="fecharModal()">✕ Cancelar</button>
            <button type="submit" class="btn btn-success">✓ Salvar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== MODAL ENVIAR PELO WHATSAPP ========== -->
  <div class="modal-overlay" id="modalWhatsappFundo">
    <div class="modal">
      <button class="modal-close" onclick="fecharModalWhatsapp()">✕</button>
      <h2><svg viewBox="0 0 24 24" width="18" height="18" fill="#25D366" style="vertical-align:-3px" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413"/></svg> Enviar OS pelo WhatsApp</h2>

      <form onsubmit="event.preventDefault(); confirmarEnvioWhatsapp();">
        <input type="hidden" id="fWhatsappOsId" value="">

        <div class="form-grid">
          <div class="form-group">
            <label>👨‍🔧 Nome do Técnico</label>
            <input type="text" id="fWhatsappNome" required placeholder="Nome do técnico">
          </div>
          <div class="form-group">
            <label>☎️ Telefone do Técnico</label>
            <input type="tel" id="fWhatsappTelefone" required placeholder="(00) 00000-0000" inputmode="numeric" oninput="this.value = mascararTelefone(this.value)">
          </div>

          <div class="form-group checkbox-group full-width">
            <input type="checkbox" id="fWhatsappSalvarPadrao">
            <label for="fWhatsappSalvarPadrao">Salvar como técnico padrão</label>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-danger" onclick="fecharModalWhatsapp()">✕ Cancelar</button>
            <button type="submit" class="btn btn-success"><svg viewBox="0 0 24 24" width="15" height="15" fill="#25D366" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413"/></svg> Enviar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== MODAL ADICIONAR ITEM (Aparelho/Marca/Campanha) ========== -->
  <div class="modal-overlay" id="modalNovoItemFundo">
    <div class="modal modal-pequeno">
      <button class="modal-close" onclick="fecharModalNovoItem()">✕</button>
      <h2 id="tituloNovoItem">➕ Novo Item</h2>

      <form onsubmit="event.preventDefault(); confirmarNovoItem();">
        <input type="hidden" id="fNovoItemTipo" value="">

        <div class="form-grid">
          <div class="form-group full-width">
            <label id="labelNovoItem">Nome</label>
            <input type="text" id="fNovoItemValor" required placeholder="Digite o nome...">
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-danger" onclick="fecharModalNovoItem()">✕ Cancelar</button>
            <button type="submit" class="btn btn-success">✓ Adicionar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== MODAL DE CONFIRMAÇÃO (genérico) ========== -->
  <div class="modal-overlay" id="modalConfirmarFundo">
    <div class="modal modal-pequeno">
      <button class="modal-close" onclick="fecharModalConfirmar()">✕</button>
      <h2 id="tituloConfirmar">⚠️ Confirmar</h2>
      <p id="mensagemConfirmar" class="modal-confirmar-mensagem"></p>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="fecharModalConfirmar()">✕ Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnConfirmarAcao" onclick="executarAcaoConfirmada()">🗑️ Excluir</button>
      </div>
    </div>
  </div>

  <!-- ========== NOTIFICAÇÕES ========== -->
  <div class="toast" id="toast"></div>

  <!-- ========== SCRIPTS ========== -->
  <!-- Biblioteca Supabase (expõe window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tipo "module" permite usar import/export -->
  <script type="module" src="js/app.js"></script>
</body>
</html>

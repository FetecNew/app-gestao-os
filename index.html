<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestão de OS FETEC - Assistência Técnica</title>
  
  <!-- ESTILOS FETEC -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- FAVICON -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2300DC41'/><text x='50' y='65' font-size='60' font-weight='bold' fill='%230A0A0A' text-anchor='middle'>⚙</text></svg>">
</head>
<body>
  <div class="container">
    
    <!-- ========== HEADER ========== -->
    <div class="header">
      <div>
        
         <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
          <img src="logo.svg" alt="FETEC Logo" style="height: 48px; width: auto; filter: drop-shadow(0 0 8px rgba(0, 220, 65, 0.4));">
        </div>

        <h1>Gestão de OS</h1>
        <span>São José dos Campos</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="exportarCSV()" title="Exportar dados em CSV">📊 Exportar</button>
        <button class="btn btn-primary" onclick="abrirNovaOS()" title="Criar nova ordem de serviço">➕ Nova OS</button>
      </div>
    </div>

    <!-- ========== ESTATÍSTICAS ========== -->
    <div class="stats-grid">
      <div class="stat-card blue">
        <div class="label">Total de OS</div>
        <div class="number" id="sTotal">0</div>
      </div>
      <div class="stat-card orange">
        <div class="label">Abertas</div>
        <div class="number" id="sAbertas">0</div>
      </div>
      <div class="stat-card blue">
        <div class="label">Em Andamento</div>
        <div class="number" id="sAndamento">0</div>
      </div>
      <div class="stat-card green">
        <div class="label">Finalizadas</div>
        <div class="number" id="sFinalizadas">0</div>
      </div>
      <div class="stat-card purple">
        <div class="label">Entregues</div>
        <div class="number" id="sEntregues">0</div>
      </div>
      <div class="stat-card teal">
        <div class="label">Faturamento</div>
        <div class="number" id="sFaturamento">R$ 0</div>
      </div>
    </div>

    <!-- ========== TABELA DE OS ========== -->
    <div class="card">
      <div class="card-header">
        <h2>📋 Ordens de Serviço</h2>
        <div class="filters-bar">
          <input type="search" id="busca" placeholder="Buscar cliente, OS, aparelho..." onkeyup="renderizar()">
          <select id="filtroStatus" onchange="renderizar()">
            <option value="">Todos</option>
            <option value="Aberto">Aberto</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Finalizado">Finalizado</option>
            <option value="Entregue">Entregue</option>
          </select>
        </div>
      </div>
      <div class="card-body">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>OS</th>
                <th>Data</th>
                <th>Cliente</th>
                <th>Aparelho</th>
                <th>Técnico</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- ========== MODAL PARA CRIAR/EDITAR ========== -->
  <div class="modal-overlay" id="modalFundo">
    <div class="modal">
      <button class="modal-close" onclick="fecharModal()">✕</button>
      <h2 id="tituloModal">⚙ Nova Ordem de Serviço</h2>
      
      <form onsubmit="event.preventDefault(); salvarOS();">
        <input type="hidden" id="indiceEdicao" value="-1">
        
        <div class="form-grid">
          <!-- Linha 1 -->
          <div class="form-group">
            <label>🔢 Número OS</label>
            <input type="text" id="fNumeroOS" readonly>
          </div>
          <div class="form-group">
            <label>📅 Data *</label>
            <input type="date" id="fData" required>
          </div>
          
          <!-- Linha 2 -->
          <div class="form-group">
            <label>👤 Cliente *</label>
            <input type="text" id="fCliente" required placeholder="Nome do cliente">
          </div>
          <div class="form-group">
            <label>☎️ Telefone</label>
            <input type="tel" id="fTelefone" placeholder="(00) 0000-0000">
          </div>
          
          <!-- Linha 3 -->
          <div class="form-group">
            <label>💬 WhatsApp</label>
            <input type="tel" id="fWhatsapp" placeholder="(00) 99999-9999">
          </div>
          <div class="form-group">
            <label>🔧 Aparelho *</label>
            <input type="text" id="fAparelho" required placeholder="Ex: Geladeira">
          </div>
          
          <!-- Linha 4 -->
          <div class="form-group">
            <label>🏷️ Marca</label>
            <input type="text" id="fMarca" placeholder="Ex: Brastemp">
          </div>
          <div class="form-group">
            <label>📦 Modelo</label>
            <input type="text" id="fModelo" placeholder="Ex: BRE80">
          </div>
          
          <!-- Linha 5 - Full Width -->
          <div class="form-group full-width">
            <label>⚠️ Defeito *</label>
            <textarea id="fDefeito" required placeholder="Descreva o defeito apresentado"></textarea>
          </div>
          
          <!-- Linha 6 -->
          <div class="form-group">
            <label>🏠 Endereço</label>
            <input type="text" id="fEndereco" placeholder="Rua, número">
          </div>
          <div class="form-group">
            <label>📝 Complemento</label>
            <input type="text" id="fComplemento" placeholder="Apto, sala, etc">
          </div>
          
          <!-- Linha 7 -->
          <div class="form-group">
            <label>📮 CEP</label>
            <input type="text" id="fCEP" placeholder="00000-000">
          </div>
          <div class="form-group">
            <label>👨‍🔧 Técnico</label>
            <input type="text" id="fTecnico" placeholder="Nome do técnico">
          </div>
          
          <!-- Linha 8 -->
          <div class="form-group">
            <label>💵 Valor Serviço (R$)</label>
            <input type="number" id="fVS" min="0" step="0.01" value="0">
          </div>
          <div class="form-group">
            <label>🛠️ Valor Peças (R$)</label>
            <input type="number" id="fVP" min="0" step="0.01" value="0">
          </div>
          
          <!-- Linha 9 -->
          <div class="form-group">
            <label>🎯 Status</label>
            <select id="fStatus">
              <option value="Aberto">🟠 Aberto</option>
              <option value="Em Andamento">🟢 Em Andamento</option>
              <option value="Finalizado">✅ Finalizado</option>
              <option value="Entregue">📦 Entregue</option>
            </select>
          </div>
          <div class="form-group">
            <label>🏁 Data Conclusão</label>
            <input type="date" id="fDC">
          </div>
          
          <!-- Linha 10 - Full Width -->
          <div class="form-group full-width">
            <label>📌 Observações</label>
            <textarea id="fObs" placeholder="Notas adicionais, recomendações, etc"></textarea>
          </div>
          
          <!-- Ações -->
          <div class="form-actions">
            <button type="button" class="btn btn-danger" onclick="fecharModal()">✕ Cancelar</button>
            <button type="submit" class="btn btn-success">✓ Salvar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== NOTIFICAÇÕES ========== -->
  <div class="toast" id="toast"></div>

  <!-- ========== SCRIPTS ========== -->
  <!-- Tipo "module" permite usar import/export -->
  <script type="module" src="js/app.js"></script>
</body>
</html>

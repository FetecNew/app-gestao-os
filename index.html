<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Gestão de OS</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- HEADER -->
  <div class="container">
    <div class="header">
      <div>
        <h1>Ordens de Serviço</h1>
        <span>Assistência Técnica Linha Branca</span>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="exportarCSV()">📊 CSV</button>
        <button class="btn btn-primary" onclick="abrirNovaOS()">+ Nova OS</button>
      </div>
    </div>

    <!-- ESTATÍSTICAS -->
    <div class="stats-grid">
      <div class="stat-card blue">
        <div class="label">Total</div>
        <div class="number" id="sTotal">0</div>
      </div>
      <div class="stat-card orange">
        <div class="label">Abertas</div>
        <div class="number" id="sAbertas">0</div>
      </div>
      <div class="stat-card blue">
        <div class="label">Andamento</div>
        <div class="number" id="sAndamento">0</div>
      </div>
      <div class="stat-card green">
        <div class="label">Finalizadas</div>
        <div class="number" id="sFinalizadas">0</div>
      </div>
      <div class="stat-card purple">
        <div class="label">Entregues</div>
        <div class="number" id="sEntregues">0</div>
      </div>
      <div class="stat-card teal">
        <div class="label">Faturamento</div>
        <div class="number" id="sFaturamento">R$ 0</div>
      </div>
    </div>

    <!-- TABELA -->
    <div class="card">
      <div class="card-header">
        <h2>Lista de OS</h2>
        <div class="filters-bar">
          <input type="search" id="busca" placeholder="Buscar..." onkeyup="renderizar()">
          <select id="filtroStatus" onchange="renderizar()">
            <option value="">Todos os Status</option>
            <option value="Aberto">Aberto</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Finalizado">Finalizado</option>
            <option value="Entregue">Entregue</option>
          </select>
        </div>
      </div>
      <div class="card-body">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>OS</th>
                <th>Data</th>
                <th>Cliente</th>
                <th>Aparelho</th>
                <th>Técnico</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalFundo">
    <div class="modal">
      <button class="modal-close" onclick="fecharModal()">×</button>
      <h2 id="tituloModal">Nova Ordem de Serviço</h2>
      
      <form onsubmit="event.preventDefault(); salvarOS();">
        <input type="hidden" id="indiceEdicao" value="-1">
        
        <div class="form-grid">
          <div class="form-group">
            <label>Número OS</label>
            <input type="text" id="fNumeroOS" readonly>
          </div>
          <div class="form-group">
            <label>Data *</label>
            <input type="date" id="fData" required>
          </div>
          
          <div class="form-group">
            <label>Cliente *</label>
            <input type="text" id="fCliente" required>
          </div>
          <div class="form-group">
            <label>Telefone</label>
            <input type="tel" id="fTelefone">
          </div>
          
          <div class="form-group">
            <label>WhatsApp</label>
            <input type="tel" id="fWhatsapp">
          </div>
          <div class="form-group">
            <label>Aparelho *</label>
            <input type="text" id="fAparelho" required>
          </div>
          
          <div class="form-group">
            <label>Marca</label>
            <input type="text" id="fMarca">
          </div>
          <div class="form-group">
            <label>Modelo</label>
            <input type="text" id="fModelo">
          </div>
          
          <div class="form-group full-width">
            <label>Defeito *</label>
            <textarea id="fDefeito" required></textarea>
          </div>
          
          <div class="form-group">
            <label>Endereço</label>
            <input type="text" id="fEndereco">
          </div>
          <div class="form-group">
            <label>Complemento</label>
            <input type="text" id="fComplemento">
          </div>
          
          <div class="form-group">
            <label>CEP</label>
            <input type="text" id="fCEP">
          </div>
          <div class="form-group">
            <label>Técnico</label>
            <input type="text" id="fTecnico">
          </div>
          
          <div class="form-group">
            <label>Valor Serviço (R$)</label>
            <input type="number" id="fVS" min="0" step="0.01" value="0">
          </div>
          <div class="form-group">
            <label>Valor Peças (R$)</label>
            <input type="number" id="fVP" min="0" step="0.01" value="0">
          </div>
          
          <div class="form-group">
            <label>Status</label>
            <select id="fStatus">
              <option value="Aberto">Aberto</option>
              <option value="Em Andamento">Em Andamento</option>
              <option value="Finalizado">Finalizado</option>
              <option value="Entregue">Entregue</option>
            </select>
          </div>
          <div class="form-group">
            <label>Data Conclusão</label>
            <input type="date" id="fDC">
          </div>
          
          <div class="form-group full-width">
            <label>Observações</label>
            <textarea id="fObs"></textarea>
          </div>
          
          <div class="form-actions">
            <button type="button" class="btn btn-danger" onclick="fecharModal()">Cancelar</button>
            <button type="submit" class="btn btn-success">Salvar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- SCRIPTS -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
